<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFB3CC"/><stop offset=".5" stop-color="#FFD6E3"/><stop offset=".85" stop-color="#FFF0EC"/>
 </linearGradient>
 <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#FFF7F0" stop-opacity=".95"/><stop offset=".4" stop-color="#FFE0D6" stop-opacity=".6"/><stop offset="1" stop-color="#FFD6E3" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B3C9"/><stop offset="1" stop-color="#F8CFDC"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C4A56"/><stop offset="1" stop-color="#34323C"/></linearGradient>
 <linearGradient id="pinkbody" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FF9CC0"/><stop offset=".55" stop-color="#EE6A9A"/><stop offset="1" stop-color="#D24A7E"/>
 </linearGradient>
 <linearGradient id="kameez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA552"/><stop offset="1" stop-color="#F47B20"/></linearGradient>
 <linearGradient id="dupatta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8578A"/><stop offset="1" stop-color="#F7A1C0"/></linearGradient>
 <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7E2EA"/></linearGradient>
 <radialGradient id="beam" cx="1" cy=".5" r="1"><stop offset="0" stop-color="#FFF4C2" stop-opacity=".8"/><stop offset="1" stop-color="#FFF4C2" stop-opacity="0"/></radialGradient>
 <radialGradient id="rim" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B7B2BE"/></radialGradient>
 <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>

