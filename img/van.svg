 </linearGradient>
 <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D45F0C"/><stop offset="1" stop-color="#B84F05"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#EAF7FD"/><stop offset=".55" stop-color="#C4E3F2"/><stop offset="1" stop-color="#9FCBE2"/>
 </linearGradient>
 <radialGradient id="beam" cx="1" cy=".5" r="1">
  <stop offset="0" stop-color="#FFF4C2" stop-opacity=".85"/><stop offset="1" stop-color="#FFF4C2" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="rim" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A9B0BA"/></radialGradient>
 <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>

