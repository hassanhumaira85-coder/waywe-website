<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFAE63"/><stop offset=".45" stop-color="#FFD3A1"/><stop offset=".8" stop-color="#FFEBD6"/>
 </linearGradient>
 <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#FFF6E5" stop-opacity=".95"/><stop offset=".35" stop-color="#FFE2B8" stop-opacity=".7"/><stop offset="1" stop-color="#FFD3A1" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6BE92"/><stop offset="1" stop-color="#F9D2B0"/></linearGradient>
 <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDA374"/><stop offset="1" stop-color="#F2B98F"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C4C56"/><stop offset="1" stop-color="#34343C"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
